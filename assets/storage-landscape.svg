<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">A system’s storage landscape</title>
  <desc id="desc">The application writes authoritative transactional facts to a relational core. Events and controlled projections feed object storage, search, analytics, and cache. Each derived store has a rebuild or refresh path.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#132B46"/></linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#104254"/><stop offset="1" stop-color="#11605E"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#54D7C8"/></marker>
    <marker id="softArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#93A9FF"/></marker>
  </defs>
  <rect width="1200" height="500" rx="24" fill="url(#background)"/>
  <text x="56" y="56" fill="#F1F7FF" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">ONE PRODUCT · PURPOSE-BUILT STORAGE</text>
  <text x="56" y="83" fill="#A9BCD2" font-family="Segoe UI,Arial,sans-serif" font-size="14">Keep authority explicit. Treat caches, indexes, and reports as projections with refresh and repair paths.</text>
  <g font-family="Segoe UI,Arial,sans-serif">
    <rect x="54" y="194" width="190" height="112" rx="16" fill="#1C3350" stroke="#496481"/>
    <text x="149" y="235" text-anchor="middle" fill="#F1F7FF" font-size="18" font-weight="700">APPLICATION</text>
    <text x="149" y="261" text-anchor="middle" fill="#A9BCD2" font-size="13">Business rules + contracts</text>
    <rect x="360" y="160" width="250" height="180" rx="18" fill="url(#primary)" stroke="#50D5C5" stroke-width="2"/>
    <text x="485" y="207" text-anchor="middle" fill="#FFFFFF" font-size="19" font-weight="700">AUTHORITATIVE CORE</text>
    <text x="485" y="235" text-anchor="middle" fill="#D0F1EC" font-size="15">Relational / transactional data</text>
    <text x="485" y="266" text-anchor="middle" fill="#B2D8D5" font-size="13">Invariants · ownership · durable facts</text>
    <text x="485" y="310" text-anchor="middle" fill="#7DE2D3" font-size="12" letter-spacing="1">SYSTEM OF RECORD</text>
    <rect x="812" y="112" width="300" height="78" rx="14" fill="#222F50" stroke="#758FE0"/>
    <text x="962" y="145" text-anchor="middle" fill="#F1F7FF" font-size="17" font-weight="700">OBJECT / BLOB STORE</text>
    <text x="962" y="169" text-anchor="middle" fill="#B9C7E8" font-size="13">Large files · versions · signed access</text>
    <rect x="812" y="211" width="300" height="78" rx="14" fill="#222F50" stroke="#758FE0"/>
    <text x="962" y="244" text-anchor="middle" fill="#F1F7FF" font-size="17" font-weight="700">SEARCH INDEX</text>
    <text x="962" y="268" text-anchor="middle" fill="#B9C7E8" font-size="13">Text retrieval · ranking · rebuildable</text>
    <rect x="812" y="310" width="300" height="78" rx="14" fill="#222F50" stroke="#758FE0"/>
    <text x="962" y="343" text-anchor="middle" fill="#F1F7FF" font-size="17" font-weight="700">ANALYTICS STORE</text>
    <text x="962" y="367" text-anchor="middle" fill="#B9C7E8" font-size="13">Historical scans · aggregates · lag target</text>
    <rect x="360" y="390" width="250" height="68" rx="14" fill="#302949" stroke="#A98CDB"/>
    <text x="485" y="419" text-anchor="middle" fill="#F1F7FF" font-size="16" font-weight="700">CACHE</text>
    <text x="485" y="441" text-anchor="middle" fill="#D3C6EB" font-size="12">Ephemeral copy · TTL / invalidation</text>
    <path d="M244 247H345" fill="none" stroke="#54D7C8" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M610 204C698 204 715 151 798 151" fill="none" stroke="#93A9FF" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#softArrow)"/>
    <path d="M610 237H798" fill="none" stroke="#93A9FF" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#softArrow)"/>
    <path d="M610 275C698 275 715 349 798 349" fill="none" stroke="#93A9FF" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#softArrow)"/>
    <path d="M485 340V378" fill="none" stroke="#54D7C8" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="708" y="124" fill="#9FAFE4" font-size="11">metadata + object key</text>
    <text x="694" y="226" fill="#9FAFE4" font-size="11">events / projection</text>
    <text x="686" y="324" fill="#9FAFE4" font-size="11">controlled data stream</text>
  </g>
  <text x="56" y="478" fill="#91A7BF" font-family="Segoe UI,Arial,sans-serif" font-size="12">Solid line: authoritative request path  ·  Dashed line: derived / asynchronous projection</text>
</svg>
